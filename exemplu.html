<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Now Playing Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Crisp Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        spotify: {
                            green: '#1DB954',
                            greenHover: '#1ed760',
                            black: '#121212',
                            dark: '#181818',
                            light: '#282828',
                            subtext: '#B3B3B3'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#121212] text-white font-sans antialiased min-h-screen flex flex-col items-center justify-center overflow-x-hidden relative selection:bg-[#1DB954] selection:text-black">

    <!-- Dynamic Adaptive Background Layer -->
    <div id="dynamic-bg" class="fixed inset-0 z-0 transition-all duration-1000 ease-out pointer-events-none" style="background: linear-gradient(180deg, rgba(45, 70, 110, 0.85) 0%, rgba(18, 18, 18, 0.96) 65%, #121212 100%);"></div>

    <!-- Subtle Ambient Noise / Glow Overlay -->
    <div class="fixed inset-0 z-0 opacity-20 pointer-events-none bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-white/10 via-transparent to-transparent"></div>

    <!-- Toast Notification Banner (Replaces alert) -->
    <div id="toast-banner" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transform -translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="bg-[#282828]/95 backdrop-blur-md border border-white/10 text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 text-sm font-medium">
            <i id="toast-icon" class="fa-solid fa-circle-info text-[#1DB954]"></i>
            <span id="toast-message">Notification message</span>
        </div>
    </div>

    <!-- Main Spotify Mobile/Desktop Card Container -->
    <main class="relative z-10 w-full max-w-[440px] px-5 py-6 sm:py-8 flex flex-col justify-between min-h-screen sm:min-h-[820px] sm:max-h-[900px] sm:rounded-3xl sm:border sm:border-white/10 sm:shadow-[0_25px_70px_-15px_rgba(0,0,0,0.85)] sm:bg-black/20 sm:backdrop-blur-xl transition-all duration-500">
        
        <!-- Top Navigation Header -->
        <header class="flex items-center justify-between pt-1 pb-4">
            <button id="btn-minimize" title="Toggle Studio Mode" class="w-10 h-10 rounded-full flex items-center justify-center text-white/80 hover:text-white hover:bg-white/10 transition active:scale-95">
                <i class="fa-solid fa-chevron-down text-lg"></i>
            </button>
            
            <div class="flex flex-col items-center text-center px-2">
                <span class="text-[10px] font-bold tracking-[0.16em] uppercase text-white/70">Playing from Studio</span>
                <span id="header-context-title" class="text-xs font-bold text-white truncate max-w-[190px]">Custom Mix</span>
            </div>

            <!-- Customize / Edit Toggle Button -->
            <button id="btn-open-studio" class="px-3.5 py-2 rounded-full bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/10 text-xs font-semibold tracking-wide text-white flex items-center gap-2 transition active:scale-95 shadow-lg">
                <i class="fa-solid fa-sliders text-[#1DB954]"></i>
                <span>Customize</span>
            </button>
        </header>

        <!-- Album Cover Art Showcase -->
        <section class="my-auto py-3 flex flex-col items-center justify-center">
            <div id="cover-container" class="relative w-full aspect-square max-w-[360px] rounded-xl overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.65)] group cursor-pointer bg-[#282828] transition-transform duration-500 ease-out">
                <!-- Album Image -->
                <img id="album-cover" 
                     src="Amintiri.jpeg" 
                     crossorigin="anonymous"
                     onerror="this.onerror=null; this.src='https://placehold.co/600x600/1e293b/1DB954?text=Cover+Art';"
                     alt="Album Cover Art" 
                     class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                
                <!-- Subtle Hover Hint to Change Cover -->
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center backdrop-blur-[2px]">
                    <span class="px-4 py-2 rounded-full bg-black/75 text-white text-xs font-semibold flex items-center gap-2 border border-white/15">
                        <i class="fa-solid fa-camera text-[#1DB954]"></i> Change Cover & Audio
                    </span>
                </div>

                <!-- Live Audio Visualizer Badge (Visible while playing) -->
                <div id="playing-badge" class="hidden absolute bottom-3 right-3 px-2.5 py-1.5 rounded-lg bg-black/70 backdrop-blur-md border border-white/10 flex items-end gap-[3px] h-7">
                    <span class="w-[3px] bg-[#1DB954] rounded-full animate-[bounce_0.8s_infinite_0.1s] h-3"></span>
                    <span class="w-[3px] bg-[#1DB954] rounded-full animate-[bounce_0.6s_infinite_0.3s] h-4"></span>
                    <span class="w-[3px] bg-[#1DB954] rounded-full animate-[bounce_0.9s_infinite_0.2s] h-2.5"></span>
                    <span class="w-[3px] bg-[#1DB954] rounded-full animate-[bounce_0.7s_infinite_0.4s] h-3.5"></span>
                </div>
            </div>
        </section>

        <!-- Track Metadata & Player Controls -->
        <section class="pt-4 pb-2 flex flex-col gap-5">
            
            <!-- Song Title, Artist & Like Button -->
            <div class="flex items-center justify-between gap-4">
                <div class="min-w-0 flex-1">
                    <h1 id="display-title" contenteditable="true" spellcheck="false" title="Click to edit song title" class="text-2xl sm:text-[26px] font-extrabold tracking-tight text-white truncate outline-none focus:bg-white/10 focus:px-2 focus:-mx-2 rounded-lg transition-all cursor-text">
                        Midnight Echoes
                    </h1>
                    <p id="display-artist" contenteditable="true" spellcheck="false" title="Click to edit artist name" class="text-base font-medium text-[#B3B3B3] hover:text-white truncate mt-0.5 outline-none focus:bg-white/10 focus:px-2 focus:-mx-2 rounded-lg transition-all cursor-text">
                        Studio Session • Voice Memo
                    </p>
                </div>

                <!-- Heart / Like Toggle -->
                <button id="btn-like" aria-label="Save to Liked Songs" class="w-11 h-11 rounded-full flex items-center justify-center text-white/70 hover:text-white transition active:scale-90 shrink-0">
                    <i id="icon-like" class="fa-regular fa-heart text-2xl transition-transform duration-300"></i>
                </button>
            </div>

            <!-- Interactive Progress Scrubber -->
            <div class="flex flex-col gap-1.5 group">
                <div id="progress-bar-container" class="relative w-full h-5 flex items-center cursor-pointer touch-none">
                    <!-- Track Background -->
                    <div class="w-full h-1 group-hover:h-1.5 bg-white/20 rounded-full overflow-hidden transition-all duration-150">
                        <!-- Filled Progress -->
                        <div id="progress-fill" class="h-full bg-white group-hover:bg-[#1DB954] rounded-full w-0 transition-colors duration-150"></div>
                    </div>
                    <!-- Scrubber Thumb -->
                    <div id="progress-thumb" class="w-3.5 h-3.5 bg-white rounded-full shadow-md absolute -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-opacity duration-150 pointer-events-none" style="left: 0%;"></div>
                </div>
                
                <!-- Time Labels -->
                <div class="flex justify-between items-center text-[11px] font-medium text-[#B3B3B3] tabular-nums">
                    <span id="time-current">0:00</span>
                    <span id="time-total">0:00</span>
                </div>
            </div>

            <!-- Primary Playback Controls -->
            <div class="flex items-center justify-between px-1">
                <!-- Shuffle Toggle -->
                <button id="btn-shuffle" aria-label="Toggle Shuffle" class="relative w-10 h-10 rounded-full flex items-center justify-center text-[#B3B3B3] hover:text-white transition active:scale-95">
                    <i class="fa-solid fa-shuffle text-lg"></i>
                    <span id="dot-shuffle" class="hidden absolute bottom-1 w-1 h-1 rounded-full bg-[#1DB954]"></span>
                </button>

                <!-- Previous / Restart Track -->
                <button id="btn-prev" aria-label="Restart Track" class="w-12 h-12 rounded-full flex items-center justify-center text-white/90 hover:text-white transition active:scale-90">
                    <i class="fa-solid fa-backward-step text-2xl"></i>
                </button>

                <!-- Play / Pause Circular Button -->
                <button id="btn-play-pause" aria-label="Play or Pause" class="w-16 h-16 rounded-full bg-white hover:bg-[#f0f0f0] hover:scale-105 active:scale-95 text-black flex items-center justify-center shadow-[0_8px_25px_rgba(0,0,0,0.4)] transition-all duration-200">
                    <i id="icon-play-pause" class="fa-solid fa-play text-2xl ml-1"></i>
                </button>

                <!-- Next / Skip Forward 10s -->
                <button id="btn-next" aria-label="Skip Forward" class="w-12 h-12 rounded-full flex items-center justify-center text-white/90 hover:text-white transition active:scale-90">
                    <i class="fa-solid fa-forward-step text-2xl"></i>
                </button>

                <!-- Repeat / Loop Toggle -->
                <button id="btn-loop" aria-label="Toggle Loop" class="relative w-10 h-10 rounded-full flex items-center justify-center text-[#B3B3B3] hover:text-white transition active:scale-95">
                    <i class="fa-solid fa-repeat text-lg"></i>
                    <span id="dot-loop" class="hidden absolute bottom-1 w-1 h-1 rounded-full bg-[#1DB954]"></span>
                </button>
            </div>

            <!-- Bottom Utility Bar: Device Indicator & Volume Slider -->
            <div class="flex items-center justify-between pt-2">
                <!-- Audio Source Badge -->
                <div class="flex items-center gap-2 text-xs font-medium text-[#1DB954]">
                    <i id="source-icon" class="fa-solid fa-wave-square"></i>
                    <span id="source-label" class="truncate max-w-[140px]">Demo Synth Loop</span>
                </div>

                <!-- Volume Control -->
                <div class="flex items-center gap-2.5 w-32 sm:w-36 group">
                    <button id="btn-mute" aria-label="Mute or Unmute" class="text-[#B3B3B3] hover:text-white transition p-1">
                        <i id="icon-volume" class="fa-solid fa-volume-high text-sm"></i>
                    </button>
                    <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Volume"
                           class="w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-white hover:accent-[#1DB954]">
                </div>
            </div>
        </section>
    </main>

    <!-- Hidden Audio Element -->
    <audio id="audio-player" preload="metadata"></audio>

    <!-- Hidden Canvas for Dominant Color Extraction -->
    <canvas id="color-canvas" class="hidden" width="50" height="50"></canvas>

    <!-- ===================================================================== -->
    <!-- CREATE / CUSTOMIZE STUDIO MODAL DRAWER                                -->
    <!-- ===================================================================== -->
    <div id="studio-modal" class="fixed inset-0 z-40 hidden items-end sm:items-center justify-center bg-black/75 backdrop-blur-sm transition-opacity duration-300 opacity-0">
        <div id="studio-panel" class="w-full max-w-[460px] bg-[#181818] border-t sm:border border-white/15 rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl transform translate-y-8 sm:translate-y-4 transition-transform duration-300 max-h-[92vh] overflow-y-auto">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-4 border-b border-white/10">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-full bg-[#1DB954]/20 text-[#1DB954] flex items-center justify-center">
                        <i class="fa-brands fa-spotify text-lg"></i>
                    </div>
                    <div>
                        <h2 class="text-base font-bold text-white">Customize Track</h2>
                        <p class="text-xs text-[#B3B3B3]">Set cover art, audio & track details</p>
                    </div>
                </div>
                <button id="btn-close-studio" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="flex flex-col gap-5 py-5">
                
                <!-- 1. Track Details Inputs -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label for="input-title" class="block text-xs font-semibold uppercase tracking-wider text-[#B3B3B3] mb-1.5">Song Title</label>
                        <input id="input-title" type="text" value="Midnight Echoes" placeholder="Enter song title..."
                               class="w-full px-3.5 py-2.5 rounded-xl bg-[#282828] border border-white/10 text-sm text-white placeholder-white/40 focus:outline-none focus:border-[#1DB954] transition">
                    </div>
                    <div>
                        <label for="input-artist" class="block text-xs font-semibold uppercase tracking-wider text-[#B3B3B3] mb-1.5">Artist Name</label>
                        <input id="input-artist" type="text" value="Studio Session • Voice Memo" placeholder="Enter artist name..."
                               class="w-full px-3.5 py-2.5 rounded-xl bg-[#282828] border border-white/10 text-sm text-white placeholder-white/40 focus:outline-none focus:border-[#1DB954] transition">
                    </div>
                </div>

                <!-- 2. Album Cover Upload -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-[#B3B3B3] mb-1.5">Album Cover Image</label>
                    <label for="input-image" class="flex items-center gap-4 p-3 rounded-2xl bg-[#282828] hover:bg-[#323232] border border-dashed border-white/20 hover:border-[#1DB954] cursor-pointer transition group">
                        <img id="modal-cover-preview" 
                             src="Amintiri.jpeg" 
                             onerror="this.onerror=null; this.src='https://placehold.co/200x200/1e293b/1DB954?text=Art';"
                             alt="Preview" class="w-14 h-14 rounded-lg object-cover shadow-md shrink-0">
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-semibold text-white group-hover:text-[#1DB954] transition truncate">Upload Cover Photo</p>
                            <p class="text-xs text-[#B3B3B3] truncate">PNG, JPG, WEBP • Auto-adapts background color</p>
                        </div>
                        <div class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white shrink-0">
                            <i class="fa-solid fa-image"></i>
                        </div>
                    </label>
                    <input id="input-image" type="file" accept="image/*" class="hidden">
                </div>

                <!-- 3. Audio Source: Upload File OR Record Microphone -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="text-xs font-semibold uppercase tracking-wider text-[#B3B3B3]">Audio Source</label>
                        <!-- Mode Switch Tabs -->
                        <div class="flex bg-[#282828] p-1 rounded-full border border-white/10">
                            <button id="tab-record" type="button" class="px-3 py-1 rounded-full text-xs font-semibold bg-[#1DB954] text-black transition">
                                <i class="fa-solid fa-microphone mr-1"></i> Record Mic
                            </button>
                            <button id="tab-upload" type="button" class="px-3 py-1 rounded-full text-xs font-semibold text-[#B3B3B3] hover:text-white transition">
                                <i class="fa-solid fa-file-audio mr-1"></i> Upload File
                            </button>
                        </div>
                    </div>

                    <!-- Panel A: Live Microphone Recorder -->
                    <div id="panel-record" class="p-4 rounded-2xl bg-[#282828] border border-white/10 flex flex-col items-center text-center gap-3">
                        <div class="flex items-center gap-2">
                            <span id="rec-dot" class="w-2.5 h-2.5 rounded-full bg-white/30"></span>
                            <span id="rec-status" class="text-xs font-semibold uppercase tracking-wider text-[#B3B3B3]">Ready to Record</span>
                        </div>

                        <div id="rec-timer" class="text-3xl font-extrabold tabular-nums tracking-tight text-white">
                            00:00
                        </div>

                        <div class="flex items-center gap-3 w-full justify-center pt-1">
                            <button id="btn-record-toggle" type="button" class="px-5 py-2.5 rounded-full bg-rose-600 hover:bg-rose-500 text-white text-sm font-bold flex items-center gap-2 shadow-lg transition active:scale-95">
                                <i id="icon-record-btn" class="fa-solid fa-microphone"></i>
                                <span id="text-record-btn">Start Recording</span>
                            </button>
                        </div>
                        <p class="text-[11px] text-[#B3B3B3]">Record a voice memo, song snippet, or beat directly from your mic.</p>
                    </div>

                    <!-- Panel B: Upload Audio File -->
                    <div id="panel-upload" class="hidden">
                        <label for="input-audio" class="flex flex-col items-center justify-center p-5 rounded-2xl bg-[#282828] hover:bg-[#323232] border border-dashed border-white/20 hover:border-[#1DB954] cursor-pointer transition text-center gap-2">
                            <div class="w-11 h-11 rounded-full bg-[#1DB954]/15 text-[#1DB954] flex items-center justify-center">
                                <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
                            </div>
                            <p id="uploaded-audio-name" class="text-sm font-semibold text-white">Choose an audio file</p>
                            <p class="text-xs text-[#B3B3B3]">Supports MP3, WAV, OGG, M4A, AAC</p>
                        </label>
                        <input id="input-audio" type="file" accept="audio/*" class="hidden">
                    </div>
                </div>
            </div>

            <!-- Done / View Player CTA -->
            <button id="btn-done-studio" type="button" class="w-full py-3.5 rounded-full bg-[#1DB954] hover:bg-[#1ed760] text-black font-bold text-sm tracking-wide shadow-lg transition active:scale-98">
                Done & View Player
            </button>
        </div>
    </div>

    <script>
        /**
         * Spotify Now Playing Studio - Interactive Logic
         * Handles:
         * 1. Custom Audio Player & Built-in Synth Fallback Audio
         * 2. Image Upload & Dominant Color Extraction for Dynamic Background
         * 3. Live Microphone Recording via MediaRecorder API
         * 4. Interactive Scrubber, Volume, Loop, Shuffle, and Inline Title/Artist Editing
         */

        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const audioPlayer = document.getElementById('audio-player');
            const dynamicBg = document.getElementById('dynamic-bg');
            const colorCanvas = document.getElementById('color-canvas');
            const colorCtx = colorCanvas.getContext('2d', { willReadFrequently: true });

            // Player Display Elements
            const albumCover = document.getElementById('album-cover');
            const coverContainer = document.getElementById('cover-container');
            const playingBadge = document.getElementById('playing-badge');
            const displayTitle = document.getElementById('display-title');
            const displayArtist = document.getElementById('display-artist');
            const headerContextTitle = document.getElementById('header-context-title');
            const sourceIcon = document.getElementById('source-icon');
            const sourceLabel = document.getElementById('source-label');

            // Playback Controls
            const btnPlayPause = document.getElementById('btn-play-pause');
            const iconPlayPause = document.getElementById('icon-play-pause');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const btnShuffle = document.getElementById('btn-shuffle');
            const dotShuffle = document.getElementById('dot-shuffle');
            const btnLoop = document.getElementById('btn-loop');
            const dotLoop = document.getElementById('dot-loop');
            const btnLike = document.getElementById('btn-like');
            const iconLike = document.getElementById('icon-like');

            // Progress Scrubber & Volume
            const progressContainer = document.getElementById('progress-bar-container');
            const progressFill = document.getElementById('progress-fill');
            const progressThumb = document.getElementById('progress-thumb');
            const timeCurrent = document.getElementById('time-current');
            const timeTotal = document.getElementById('time-total');
            const volumeSlider = document.getElementById('volume-slider');
            const btnMute = document.getElementById('btn-mute');
            const iconVolume = document.getElementById('icon-volume');

            // Studio Modal Elements
            const studioModal = document.getElementById('studio-modal');
            const studioPanel = document.getElementById('studio-panel');
            const btnOpenStudio = document.getElementById('btn-open-studio');
            const btnMinimize = document.getElementById('btn-minimize');
            const btnCloseStudio = document.getElementById('btn-close-studio');
            const btnDoneStudio = document.getElementById('btn-done-studio');

            // Inputs & Recorder
            const inputTitle = document.getElementById('input-title');
            const inputArtist = document.getElementById('input-artist');
            const inputImage = document.getElementById('input-image');
            const modalCoverPreview = document.getElementById('modal-cover-preview');
            const inputAudio = document.getElementById('input-audio');
            const uploadedAudioName = document.getElementById('uploaded-audio-name');

            const tabRecord = document.getElementById('tab-record');
            const tabUpload = document.getElementById('tab-upload');
            const panelRecord = document.getElementById('panel-record');
            const panelUpload = document.getElementById('panel-upload');

            const btnRecordToggle = document.getElementById('btn-record-toggle');
            const iconRecordBtn = document.getElementById('icon-record-btn');
            const textRecordBtn = document.getElementById('text-record-btn');
            const recDot = document.getElementById('rec-dot');
            const recStatus = document.getElementById('rec-status');
            const recTimer = document.getElementById('rec-timer');

            // Toast Notification
            const toastBanner = document.getElementById('toast-banner');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');
            let toastTimeout = null;

            // --- Application State ---
            let isLiked = false;
            let isLooping = false;
            let isShuffling = false;
            let isScrubbing = false;
            let previousVolume = 0.85;

            // Recording State
            let mediaRecorder = null;
            let recordedChunks = [];
            let isRecording = false;
            let recInterval = null;
            let recSeconds = 0;
            let activeStream = null;

            // --- Helper: Show Non-Blocking Toast ---
            function showToast(message, type = 'info') {
                toastMessage.textContent = message;
                if (type === 'error') {
                    toastIcon.className = 'fa-solid fa-circle-exclamation text-rose-500';
                } else if (type === 'rec') {
                    toastIcon.className = 'fa-solid fa-microphone text-rose-500 animate-pulse';
                } else {
                    toastIcon.className = 'fa-solid fa-circle-check text-[#1DB954]';
                }

                toastBanner.classList.remove('-translate-y-24', 'opacity-0');
                toastBanner.classList.add('translate-y-0', 'opacity-100');

                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toastBanner.classList.remove('translate-y-0', 'opacity-100');
                    toastBanner.classList.add('-translate-y-24', 'opacity-0');
                }, 3200);
            }

            // --- Helper: Format Seconds to M:SS ---
            function formatTime(seconds) {
                if (!isFinite(seconds) || isNaN(seconds) || seconds < 0) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            // --- Generate Built-in Ambient Chord WAV Blob (So player works immediately!) ---
            function createDemoAudioBlob() {
                const sampleRate = 44100;
                const duration = 12; // 12 seconds lush chill chord progression
                const numSamples = sampleRate * duration;
                const buffer = new ArrayBuffer(44 + numSamples * 2);
                const view = new DataView(buffer);

                const writeString = (offset, str) => {
                    for (let i = 0; i < str.length; i++) {
                        view.setUint8(offset + i, str.charCodeAt(i));
                    }
                };

                writeString(0, 'RIFF');
                view.setUint32(4, 36 + numSamples * 2, true);
                writeString(8, 'WAVE');
                writeString(12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true); // PCM
                view.setUint16(22, 1, true); // Mono
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * 2, true);
                view.setUint16(32, 2, true);
                view.setUint16(34, 16, true);
                writeString(36, 'data');
                view.setUint32(40, numSamples * 2, true);

                // Lo-fi synth chord frequencies (Fmaj7 -> Em7 -> Dm7 -> Cmaj7)
                const chords = [
                    [174.61, 220.00, 261.63, 329.63],
                    [164.81, 196.00, 246.94, 293.66],
                    [146.83, 174.61, 220.00, 261.63],
                    [130.81, 164.81, 196.00, 246.94]
                ];

                for (let i = 0; i < numSamples; i++) {
                    const t = i / sampleRate;
                    const chordIndex = Math.floor(t / 3) % chords.length;
                    const chord = chords[chordIndex];
                    const localT = t % 3;

                    // Soft envelope per chord
                    const env = Math.min(1, localT * 3) * Math.exp(-localT * 0.45);
                    let sample = 0;
                    for (let f = 0; f < chord.length; f++) {
                        sample += Math.sin(2 * Math.PI * chord[f] * t) * 0.14;
                        sample += Math.sin(2 * Math.PI * (chord[f] * 2) * t) * 0.03;
                    }
                    // Gentle master fade in/out
                    const masterFade = Math.min(1, t * 2) * Math.min(1, (duration - t) * 2);
                    const val = Math.max(-1, Math.min(1, sample * env * masterFade));
                    view.setInt16(44 + i * 2, val * 32767, true);
                }

                return new Blob([buffer], { type: 'audio/wav' });
            }

            // Load Demo Audio on Startup
            const demoBlob = createDemoAudioBlob();
            audioPlayer.src = URL.createObjectURL(demoBlob);
            audioPlayer.volume = previousVolume;

            // --- Dynamic Dominant Color Extraction ---
            function extractAndApplyColor(imgElement) {
                try {
                    colorCtx.drawImage(imgElement, 0, 0, 50, 50);
                    const imageData = colorCtx.getImageData(0, 0, 50, 50).data;
                    let r = 0, g = 0, b = 0, count = 0;

                    for (let i = 0; i < imageData.length; i += 16) {
                        const red = imageData[i];
                        const green = imageData[i + 1];
                        const blue = imageData[i + 2];
                        const alpha = imageData[i + 3];

                        if (alpha < 128) continue;
                        // Skip near-pure black/white pixels for richer vibrancy
                        const brightness = (red + green + blue) / 3;
                        if (brightness > 20 && brightness < 235) {
                            r += red;
                            g += green;
                            b += blue;
                            count++;
                        }
                    }

                    if (count > 0) {
                        r = Math.round(r / count);
                        g = Math.round(g / count);
                        b = Math.round(b / count);

                        // Boost saturation slightly for Spotify aesthetic
                        const max = Math.max(r, g, b);
                        const min = Math.min(r, g, b);
                        if (max !== min) {
                            r = Math.min(255, Math.round(r * 1.1));
                            g = Math.min(255, Math.round(g * 1.1));
                            b = Math.min(255, Math.round(b * 1.1));
                        }

                        dynamicBg.style.background = `linear-gradient(180deg, rgba(${r}, ${g}, ${b}, 0.88) 0%, rgba(${Math.round(r * 0.35)}, ${Math.round(g * 0.35)}, ${Math.round(b * 0.35)}, 0.94) 52%, #121212 100%)`;
                    }
                } catch (err) {
                    // Fallback gradient if CORS prevents pixel read on external image
                    dynamicBg.style.background = `linear-gradient(180deg, rgba(45, 70, 110, 0.85) 0%, rgba(18, 18, 18, 0.96) 65%, #121212 100%)`;
                }
            }

            albumCover.addEventListener('load', () => {
                extractAndApplyColor(albumCover);
            });
            if (albumCover.complete) {
                extractAndApplyColor(albumCover);
            }

            // --- Audio Playback Controls ---
            function updatePlayUI(isPlaying) {
                if (isPlaying) {
                    iconPlayPause.className = 'fa-solid fa-pause text-2xl';
                    playingBadge.classList.remove('hidden');
                    coverContainer.classList.add('scale-[1.02]');
                } else {
                    iconPlayPause.className = 'fa-solid fa-play text-2xl ml-1';
                    playingBadge.classList.add('hidden');
                    coverContainer.classList.remove('scale-[1.02]');
                }
            }

            function togglePlayPause() {
                if (audioPlayer.paused) {
                    audioPlayer.play().then(() => {
                        updatePlayUI(true);
                    }).catch(() => {
                        showToast('Tap play again or upload an audio track', 'info');
                    });
                } else {
                    audioPlayer.pause();
                    updatePlayUI(false);
                }
            }

            btnPlayPause.addEventListener('click', togglePlayPause);

            audioPlayer.addEventListener('ended', () => {
                if (isLooping) {
                    audioPlayer.currentTime = 0;
                    audioPlayer.play();
                } else {
                    updatePlayUI(false);
                }
            });

            // Restart / Previous Button
            btnPrev.addEventListener('click', () => {
                audioPlayer.currentTime = 0;
                showToast('Restarted track');
            });

            // Skip Forward 10s Button
            btnNext.addEventListener('click', () => {
                if (isFinite(audioPlayer.duration)) {
                    audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + 10);
                }
            });

            // Loop Toggle
            btnLoop.addEventListener('click', () => {
                isLooping = !isLooping;
                audioPlayer.loop = isLooping;
                btnLoop.classList.toggle('text-[#1DB954]', isLooping);
                btnLoop.classList.toggle('text-[#B3B3B3]', !isLooping);
                dotLoop.classList.toggle('hidden', !isLooping);
                showToast(isLooping ? 'Loop enabled' : 'Loop disabled');
            });

            // Shuffle Aesthetic Toggle
            btnShuffle.addEventListener('click', () => {
                isShuffling = !isShuffling;
                btnShuffle.classList.toggle('text-[#1DB954]', isShuffling);
                btnShuffle.classList.toggle('text-[#B3B3B3]', !isShuffling);
                dotShuffle.classList.toggle('hidden', !isShuffling);
                showToast(isShuffling ? 'Smart Shuffle on' : 'Shuffle off');
            });

            // Like Heart Toggle
            btnLike.addEventListener('click', () => {
                isLiked = !isLiked;
                if (isLiked) {
                    iconLike.className = 'fa-solid fa-heart text-2xl text-[#1DB954] scale-110 transition-transform duration-300';
                    showToast('Added to Liked Songs');
                } else {
                    iconLike.className = 'fa-regular fa-heart text-2xl text-white/70 transition-transform duration-300';
                    showToast('Removed from Liked Songs');
                }
            });

            // --- Progress Scrubber Logic (Mouse & Touch) ---
            audioPlayer.addEventListener('loadedmetadata', () => {
                timeTotal.textContent = formatTime(audioPlayer.duration);
            });

            audioPlayer.addEventListener('timeupdate', () => {
                if (isScrubbing) return;
                const current = audioPlayer.currentTime;
                const duration = audioPlayer.duration || 1;
                const percent = Math.min(100, Math.max(0, (current / duration) * 100));

                progressFill.style.width = `${percent}%`;
                progressThumb.style.left = `${percent}%`;
                timeCurrent.textContent = formatTime(current);
                if (isFinite(audioPlayer.duration)) {
                    timeTotal.textContent = formatTime(audioPlayer.duration);
                }
            });

            function scrubToEvent(clientX) {
                const rect = progressContainer.getBoundingClientRect();
                const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
                const percent = ratio * 100;
                progressFill.style.width = `${percent}%`;
                progressThumb.style.left = `${percent}%`;

                if (isFinite(audioPlayer.duration)) {
                    const newTime = ratio * audioPlayer.duration;
                    timeCurrent.textContent = formatTime(newTime);
                    audioPlayer.currentTime = newTime;
                }
            }

            progressContainer.addEventListener('mousedown', (e) => {
                isScrubbing = true;
                scrubToEvent(e.clientX);
            });

            window.addEventListener('mousemove', (e) => {
                if (isScrubbing) scrubToEvent(e.clientX);
            });

            window.addEventListener('mouseup', () => {
                isScrubbing = false;
            });

            progressContainer.addEventListener('touchstart', (e) => {
                isScrubbing = true;
                if (e.touches.length > 0) scrubToEvent(e.touches[0].clientX);
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (isScrubbing && e.touches.length > 0) scrubToEvent(e.touches[0].clientX);
            }, { passive: true });

            window.addEventListener('touchend', () => {
                isScrubbing = false;
            });

            // --- Volume Control ---
            function updateVolumeIcon(val) {
                if (val === 0) {
                    iconVolume.className = 'fa-solid fa-volume-xmark text-sm text-rose-400';
                } else if (val < 0.5) {
                    iconVolume.className = 'fa-solid fa-volume-low text-sm';
                } else {
                    iconVolume.className = 'fa-solid fa-volume-high text-sm';
                }
            }

            volumeSlider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                audioPlayer.volume = val;
                if (val > 0) previousVolume = val;
                updateVolumeIcon(val);
            });

            btnMute.addEventListener('click', () => {
                if (audioPlayer.volume > 0) {
                    previousVolume = audioPlayer.volume;
                    audioPlayer.volume = 0;
                    volumeSlider.value = 0;
                    updateVolumeIcon(0);
                } else {
                    audioPlayer.volume = previousVolume || 0.85;
                    volumeSlider.value = audioPlayer.volume;
                    updateVolumeIcon(audioPlayer.volume);
                }
            });

            // --- Studio Modal Open / Close ---
            function openStudioModal() {
                studioModal.classList.remove('hidden');
                studioModal.classList.add('flex');
                requestAnimationFrame(() => {
                    studioModal.classList.remove('opacity-0');
                    studioPanel.classList.remove('translate-y-8', 'sm:translate-y-4');
                });
            }

            function closeStudioModal() {
                if (isRecording) {
                    stopRecording();
                }
                studioModal.classList.add('opacity-0');
                studioPanel.classList.add('translate-y-8', 'sm:translate-y-4');
                setTimeout(() => {
                    studioModal.classList.add('hidden');
                    studioModal.classList.remove('flex');
                }, 280);
            }

            btnOpenStudio.addEventListener('click', openStudioModal);
            coverContainer.addEventListener('click', openStudioModal);
            btnCloseStudio.addEventListener('click', closeStudioModal);
            btnDoneStudio.addEventListener('click', closeStudioModal);

            studioModal.addEventListener('click', (e) => {
                if (e.target === studioModal) closeStudioModal();
            });

            btnMinimize.addEventListener('click', () => {
                showToast('Clean Now-Playing View Active');
            });

            // --- Sync Title & Artist (Both Modal Inputs & Inline ContentEditable) ---
            inputTitle.addEventListener('input', (e) => {
                const val = e.target.value.trim() || 'Untitled Track';
                displayTitle.textContent = val;
                headerContextTitle.textContent = val;
            });

            inputArtist.addEventListener('input', (e) => {
                const val = e.target.value.trim() || 'Unknown Artist';
                displayArtist.textContent = val;
            });

            displayTitle.addEventListener('input', () => {
                const val = displayTitle.textContent.trim() || 'Untitled Track';
                inputTitle.value = val;
                headerContextTitle.textContent = val;
            });

            displayArtist.addEventListener('input', () => {
                const val = displayArtist.textContent.trim() || 'Unknown Artist';
                inputArtist.value = val;
            });

            // Prevent newlines on Enter key for inline editable text
            [displayTitle, displayArtist].forEach(el => {
                el.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        el.blur();
                    }
                });
            });

            // --- Image Upload Handler ---
            inputImage.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    showToast('Please select a valid image file', 'error');
                    return;
                }

                const imageUrl = URL.createObjectURL(file);
                albumCover.src = imageUrl;
                modalCoverPreview.src = imageUrl;
                showToast('Album cover updated!');
            });

            // --- Audio Source Tabs (Record vs Upload) ---
            tabRecord.addEventListener('click', () => {
                tabRecord.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-[#1DB954] text-black transition';
                tabUpload.className = 'px-3 py-1 rounded-full text-xs font-semibold text-[#B3B3B3] hover:text-white transition';
                panelRecord.classList.remove('hidden');
                panelUpload.classList.add('hidden');
            });

            tabUpload.addEventListener('click', () => {
                tabUpload.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-[#1DB954] text-black transition';
                tabRecord.className = 'px-3 py-1 rounded-full text-xs font-semibold text-[#B3B3B3] hover:text-white transition';
                panelUpload.classList.remove('hidden');
                panelRecord.classList.add('hidden');
            });

            // --- Audio File Upload Handler ---
            inputAudio.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const audioUrl = URL.createObjectURL(file);
                audioPlayer.src = audioUrl;
                audioPlayer.load();

                const cleanName = file.name.replace(/\.[^/.]+$/, '');
                uploadedAudioName.textContent = file.name;
                sourceIcon.className = 'fa-solid fa-file-audio';
                sourceLabel.textContent = cleanName;

                // Auto-fill title if still default
                if (inputTitle.value === 'Midnight Echoes') {
                    inputTitle.value = cleanName;
                    displayTitle.textContent = cleanName;
                    headerContextTitle.textContent = cleanName;
                }

                showToast('Audio track loaded!');
            });

            // --- Live Microphone Recording (MediaRecorder API) ---
            async function startRecording() {
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        showToast('Microphone recording is not supported in this browser', 'error');
                        return;
                    }

                    // Pause player while recording
                    if (!audioPlayer.paused) {
                        audioPlayer.pause();
                        updatePlayUI(false);
                    }

                    activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    recordedChunks = [];
                    mediaRecorder = new MediaRecorder(activeStream);

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data && event.data.size > 0) {
                            recordedChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                        const recordedUrl = URL.createObjectURL(audioBlob);
                        audioPlayer.src = recordedUrl;
                        audioPlayer.load();

                        // Stop microphone tracks
                        if (activeStream) {
                            activeStream.getTracks().forEach(track => track.stop());
                        }

                        const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        sourceIcon.className = 'fa-solid fa-microphone-lines';
                        sourceLabel.textContent = `Mic Recording (${timestamp})`;

                        if (inputTitle.value === 'Midnight Echoes') {
                            const recTitle = `Voice Recording ${timestamp}`;
                            inputTitle.value = recTitle;
                            displayTitle.textContent = recTitle;
                            headerContextTitle.textContent = recTitle;
                        }

                        showToast('Recording saved to player!');
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recSeconds = 0;
                    recTimer.textContent = '00:00';

                    // Update UI to Recording State
                    btnRecordToggle.className = 'px-5 py-2.5 rounded-full bg-white hover:bg-neutral-200 text-black text-sm font-bold flex items-center gap-2 shadow-lg transition active:scale-95';
                    iconRecordBtn.className = 'fa-solid fa-stop text-rose-600';
                    textRecordBtn.textContent = 'Stop Recording';
                    recDot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping';
                    recStatus.textContent = 'Recording Live...';
                    recStatus.className = 'text-xs font-bold uppercase tracking-wider text-rose-400';

                    recInterval = setInterval(() => {
                        recSeconds++;
                        const mins = String(Math.floor(recSeconds / 60)).padStart(2, '0');
                        const secs = String(recSeconds % 60).padStart(2, '0');
                        recTimer.textContent = `${mins}:${secs}`;
                    }, 1000);

                    showToast('Microphone recording started', 'rec');

                } catch (err) {
                    showToast('Microphone permission denied or unavailable', 'error');
                }
            }

            function stopRecording() {
                if (mediaRecorder && isRecording) {
                    mediaRecorder.stop();
                    isRecording = false;
                    clearInterval(recInterval);

                    // Reset UI
                    btnRecordToggle.className = 'px-5 py-2.5 rounded-full bg-rose-600 hover:bg-rose-500 text-white text-sm font-bold flex items-center gap-2 shadow-lg transition active:scale-95';
                    iconRecordBtn.className = 'fa-solid fa-microphone';
                    textRecordBtn.textContent = 'Record Again';
                    recDot.className = 'w-2.5 h-2.5 rounded-full bg-[#1DB954]';
                    recStatus.textContent = 'Recording Ready';
                    recStatus.className = 'text-xs font-semibold uppercase tracking-wider text-[#1DB954]';
                }
            }

            btnRecordToggle.addEventListener('click', () => {
                if (!isRecording) {
                    startRecording();
                } else {
                    stopRecording();
                }
            });

            // Keyboard Spacebar shortcut for Play/Pause (when not typing in inputs)
            document.addEventListener('keydown', (e) => {
                const tag = document.activeElement.tagName.toLowerCase();
                const isEditable = document.activeElement.isContentEditable;
                if (e.code === 'Space' && tag !== 'input' && tag !== 'textarea' && !isEditable) {
                    e.preventDefault();
                    togglePlayPause();
                }
            });
        });
    </script>
</body>
</html>
